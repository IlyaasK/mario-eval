Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Info
# Default deny: only hosts matching allowlist.txt are reachable.
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
# HTTPS only (CONNECT to 443).
ConnectPort 443
Allow 0.0.0.0/0
DisableViaHeader Yes
